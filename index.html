<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الأصول الشامل - Samcrete</title>
    
    <!-- Chart.js للرسوم البيانية -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- XLSX لقراءة وكتابة ملفات Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <!-- JS Barcode لطباعة الباركود -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <!-- MSAL.js for Microsoft Authentication -->
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
    
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- FileSaver.js لحفظ الملفات -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1800px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 25px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .header h1 {
            color: white;
            font-size: 1.8em;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .samcrete-logo {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 320px;
            height: 90px;
            overflow: hidden;
        }
        
        .samcrete-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        
        .samcrete-logo i {
            font-size: 2em;
        }
        
        .logo-text h1 {
            font-size: 2em;
            background: linear-gradient(135deg, #fff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        
        .logo-text p {
            color: rgba(255,255,255,0.8);
            font-size: 1em;
        }
        
        .toolbar {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16,185,129,0.3);
        }
        
        .add-btn {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30,60,114,0.3);
        }
        
        .save-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245,158,11,0.3);
        }
        
        .sync-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .sync-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59,130,246,0.3);
        }
        
        .export-btn {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139,92,246,0.3);
        }
        
        .print-btn {
            background: linear-gradient(135deg, #374151, #1e293b);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .print-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(55,65,81,0.3);
        }
        
        .filters-bar {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filters-bar.hidden {
            display: none;
        }
        
        .filter-group {
            flex: 1;
            min-width: 200px;
        }
        
        .filter-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1e3c72;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .filter-label i {
            font-size: 1.2em;
        }
        
        .filter-select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e7ff;
            border-radius: 12px;
            font-size: 1em;
            color: #333;
            background: #f8faff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filter-select:hover {
            border-color: #1e3c72;
        }
        
        .filter-select:focus {
            outline: none;
            border-color: #1e3c72;
            box-shadow: 0 0 0 3px rgba(30,60,114,0.1);
        }
        
        .search-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e7ff;
            border-radius: 12px;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #1e3c72;
            box-shadow: 0 0 0 3px rgba(30,60,114,0.1);
        }
        
        .clear-filters {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .clear-filters:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }
        
        .lang-toggle {
            background: rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 5px;
            display: inline-flex;
        }
        
        .lang-option {
            padding: 10px 25px;
            border: none;
            background: transparent;
            border-radius: 50px;
            font-size: 1em;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .lang-option.active {
            background: white;
            color: #1e3c72;
        }
        
        .file-status {
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 0.9em;
        }
        
        .file-status.online {
            background: rgba(16, 185, 129, 0.3);
        }
        
        .file-status i {
            font-size: 1.1em;
        }
        
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .kpi-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .kpi-card:hover {
            transform: translateY(-5px);
        }
        
        .kpi-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #1e3c72, #2a5298);
        }
        
        .kpi-icon {
            font-size: 2.5em;
            color: #1e3c72;
            margin-bottom: 15px;
        }
        
        .kpi-title {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .kpi-value {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }
        
        .categories-wrapper {
            background: white;
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow-x: auto;
        }
        
        .categories-grid {
            display: flex;
            flex-wrap: nowrap;
            gap: 15px;
            min-width: min-content;
        }
        
        .category-card {
            flex: 0 0 auto;
            width: 160px;
            background: linear-gradient(145deg, #ffffff, #f5f7ff);
            border-radius: 20px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }
        
        .category-card.active {
            border-color: #1e3c72;
            background: linear-gradient(145deg, #e8efff, #d9e4ff);
        }
        
        .category-icon {
            font-size: 2.5em;
            color: #1e3c72;
            margin-bottom: 8px;
        }
        
        .category-name {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
            margin-bottom: 8px;
            white-space: nowrap;
        }
        
        .category-count {
            font-size: 1.8em;
            font-weight: bold;
            color: #1e3c72;
            line-height: 1.2;
        }
        
        .charts-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .chart-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        
        .chart-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eef2f6;
        }
        
        .chart-title i {
            color: #1e3c72;
            margin-left: 10px;
        }
        
        canvas {
            max-height: 350px;
            width: 100% !important;
        }
        
        .data-table-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            width: 100%;
            overflow: hidden;
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .table-title {
            font-size: 1.4em;
            color: #1e3c72;
            font-weight: 600;
        }
        
        .table-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .rows-per-page {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95em;
        }
        
        .rows-per-page select {
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid #e0e7ff;
        }
        
        .active-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .filter-badge {
            background: #1e3c72;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .filter-badge i {
            cursor: pointer;
        }
        
        .filter-badge i:hover {
            opacity: 0.8;
        }
        
        .table-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: visible;
            border-radius: 12px;
            border: 1px solid #eef2f6;
            margin-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 100%;
            table-layout: auto;
            white-space: nowrap;
        }
        
        .data-table td.edit-mode {
            white-space: normal;
        }
        
        .data-table th {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 15px;
            font-weight: 500;
            position: sticky;
            top: 0;
            z-index: 10;
            white-space: nowrap;
        }
        
        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #eef2f6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
        }
        
        .data-table td .status-badge {
            white-space: nowrap;
            display: inline-block;
        }
        
        .data-table td.editing {
            white-space: normal;
            max-width: none;
            overflow: visible;
        }
        
        .data-table tr:hover {
            background: #f0f7ff;
        }
        
        .edit-input {
            width: 100%;
            padding: 8px;
            border: 2px solid #1e3c72;
            border-radius: 8px;
            font-size: 0.95em;
            background: white;
            min-width: 150px;
        }
        
        .edit-select {
            width: 100%;
            padding: 8px;
            border: 2px solid #1e3c72;
            border-radius: 8px;
            background: white;
            min-width: 150px;
        }
        
        .action-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            white-space: nowrap;
        }
        
        .btn-edit {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-edit:hover {
            background: #d97706;
        }
        
        .btn-save {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-save:hover {
            background: #059669;
        }
        
        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-delete:hover {
            background: #dc2626;
        }
        
        .btn-barcode {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-barcode:hover {
            background: #6d28d9;
        }
        
        .status-badge {
            padding: 5px 15px;
            border-radius: 30px;
            font-size: 0.9em;
            font-weight: 500;
            display: inline-block;
        }
        
        .status-good {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status-maintenance {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .status-outdated {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-not-checked {
            background: #e2e3e5;
            color: #383d41;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eef2f6;
        }
        
        .modal-header h2 {
            color: #1e3c72;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #666;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group.full-width {
            grid-column: span 2;
        }
        
        .form-label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        
        .form-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e7ff;
            border-radius: 8px;
            font-size: 1em;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #1e3c72;
        }
        
        .form-select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e7ff;
            border-radius: 8px;
            background: white;
        }
        
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #eef2f6;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-secondary {
            background: #e2e8f0;
            color: #333;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            z-index: 2000;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                top: -100px;
                opacity: 0;
            }
            to {
                top: 20px;
                opacity: 1;
            }
        }
        
        .alert-success {
            background: #10b981;
        }
        
        .alert-error {
            background: #ef4444;
        }
        
        .alert-info {
            background: #3b82f6;
        }
        
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.9);
            margin-top: 30px;
            font-size: 1.1em;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .page-btn {
            padding: 8px 15px;
            border: 1px solid #e0e7ff;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .page-btn:hover {
            background: #f0f7ff;
            border-color: #1e3c72;
        }
        
        .page-btn.active {
            background: #1e3c72;
            color: white;
            border-color: #1e3c72;
        }
        
        body[dir="ltr"] {
            text-align: left;
        }
        
        @media (max-width: 768px) {
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .charts-row {
                grid-template-columns: 1fr;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .form-group.full-width {
                grid-column: span 1;
            }
            
            .data-table td {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <div class="samcrete-logo">
                    <img id="logoImage" src="samcrete-logo.png" alt="Samcrete Logo" />
                </div>
            </div>
            <div class="logo-text" style="flex: 1;">
                <h1 id="mainTitle">نظام إدارة الأصول الشامل</h1>
                <p id="subTitle"><i class="fas fa-building"></i> Samcrete Egypt - إدارة ومتابعة الأصول</p>
            </div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <div class="file-status" id="fileStatus">
                    <i class="fas fa-cloud" id="fileStatusIcon"></i>
                    <span id="fileStatusText">غير متصل</span>
                </div>
                <div class="lang-toggle">
                    <button class="lang-option active" data-lang="ar">🇪🇬 العربية</button>
                    <button class="lang-option" data-lang="en">🇬🇧 English</button>
                </div>
            </div>
        </div>

        <div class="toolbar">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                <i class="fas fa-upload"></i>
                <span id="uploadBtnText">تحميل ملف Excel</span>
            </button>
            <input type="file" id="fileInput" accept=".xlsx,.xls" style="display: none;" onchange="handleFileUpload(this)">
            
            <button class="add-btn" onclick="showAddModal()">
                <i class="fas fa-plus"></i>
                <span id="addBtnText">إضافة أصل جديد</span>
            </button>
            
            <button class="export-btn" onclick="exportToExcel()">
                <i class="fas fa-file-export"></i>
                <span id="exportBtnText">تصدير Excel</span>
            </button>
            
            <button class="print-btn" onclick="printTable()">
                <i class="fas fa-print"></i>
                <span id="printBtnText">طباعة</span>
            </button>
        </div>

        <!-- شريط الفلاتر الديناميكية -->
        <div class="filters-bar hidden" id="dynamicFiltersBar"></div>

        <div class="data-table-container">
            <div class="table-header">
                <h3 class="table-title" id="tableTitle">البيانات</h3>
            </div>
            <div class="table-scroll">
                <table id="dataTable" class="data-table">
                    <thead>
                        <tr id="tableHeader"></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="footer" id="footer">
            <p>© 2024 نظام إدارة الأصول - Samcrete Egypt</p>
        </div>
    </div>

    <script>
        // البيانات والمتغيرات
        let allData = [];
        let filteredData = [];
        let dynamicColumns = [];
        let activeFilters = {};
        
        // تحميل الملف
        function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const wb = XLSX.read(e.target.result, { type: 'array' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(ws);
                    
                    if (data.length > 0) {
                        allData = data;
                        filteredData = data;
                        dynamicColumns = Object.keys(data[0]);
                        activeFilters = {};
                        
                        renderDynamicFilters();
                        renderTable();
                        showAlert('تم تحميل الملف بنجاح! عدد الصفوف: ' + data.length, 'success');
                    } else {
                        showAlert('الملف فارغ!', 'error');
                    }
                } catch (error) {
                    showAlert('خطأ في قراءة الملف', 'error');
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // رسم الفلاتر الديناميكية
        function renderDynamicFilters() {
            const filtersBar = document.getElementById('dynamicFiltersBar');
            filtersBar.innerHTML = '';
            
            if (dynamicColumns.length === 0) {
                filtersBar.classList.add('hidden');
                return;
            }
            
            filtersBar.classList.remove('hidden');

            // إنشاء فلتر لكل عمود
            dynamicColumns.forEach(columnName => {
                const filterGroup = document.createElement('div');
                filterGroup.className = 'filter-group';

                const label = document.createElement('label');
                label.className = 'filter-label';
                label.innerHTML = `
                    <i class="fas fa-filter"></i>
                    <span>${columnName}</span>
                `;

                const select = document.createElement('select');
                select.className = 'filter-select';
                select.dataset.column = columnName;
                select.onchange = applyDynamicFilters;

                // خيار "الكل"
                const allOption = document.createElement('option');
                allOption.value = '';
                allOption.textContent = 'الكل';
                select.appendChild(allOption);

                // الحصول على القيم الفريدة وترتيبها
                const uniqueValues = [...new Set(
                    allData.map(row => String(row[columnName] || ''))
                )].filter(v => v).sort();

                uniqueValues.forEach(value => {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = value;
                    select.appendChild(option);
                });

                filterGroup.appendChild(label);
                filterGroup.appendChild(select);
                filtersBar.appendChild(filterGroup);
            });

            // زر مسح الفلاتر
            const clearBtn = document.createElement('button');
            clearBtn.className = 'clear-filters';
            clearBtn.innerHTML = '<i class="fas fa-times"></i> <span>مسح الفلاتر</span>';
            clearBtn.onclick = clearAllDynamicFilters;
            filtersBar.appendChild(clearBtn);
        }

        // تطبيق الفلاتر الديناميكية
        function applyDynamicFilters() {
            activeFilters = {};
            document.querySelectorAll('#dynamicFiltersBar .filter-select').forEach(select => {
                if (select.value) {
                    activeFilters[select.dataset.column] = select.value;
                }
            });

            // تصفية البيانات
            filteredData = allData.filter(row => {
                for (const [column, filterValue] of Object.entries(activeFilters)) {
                    if (String(row[column] || '') !== filterValue) {
                        return false;
                    }
                }
                return true;
            });

            renderTable();
        }

        // مسح الفلاتر
        function clearAllDynamicFilters() {
            document.querySelectorAll('#dynamicFiltersBar .filter-select').forEach(select => {
                select.value = '';
            });
            activeFilters = {};
            filteredData = allData;
            renderTable();
        }

        // رسم الجدول
        function renderTable() {
            const tableHeader = document.getElementById('tableHeader');
            const tableBody = document.getElementById('tableBody');

            tableHeader.innerHTML = '';
            tableBody.innerHTML = '';

            if (!dynamicColumns || dynamicColumns.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 20px;">لا توجد بيانات</td></tr>';
                return;
            }

            // رسم رؤوس الجدول
            dynamicColumns.forEach(columnName => {
                const th = document.createElement('th');
                th.textContent = columnName;
                tableHeader.appendChild(th);
            });

            // رسم صفوف البيانات
            if (filteredData.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="' + dynamicColumns.length + '" style="text-align:center; padding: 20px;">لا توجد نتائج</td></tr>';
                return;
            }

            filteredData.forEach(row => {
                const tr = document.createElement('tr');
                dynamicColumns.forEach(columnName => {
                    const td = document.createElement('td');
                    td.textContent = row[columnName] || '';
                    tr.appendChild(td);
                });
                tableBody.appendChild(tr);
            });
        }

        // دوال مساعدة
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert alert-' + type;
            alertDiv.textContent = message;
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }

        function showAddModal() {
            showAlert('سيتم تفعيل إضافة أصل جديد قريباً', 'info');
        }

        function exportToExcel() {
            if (allData.length === 0) {
                showAlert('لا توجد بيانات للتصدير', 'error');
                return;
            }
            
            const ws = XLSX.utils.json_to_sheet(allData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Assets');
            XLSX.writeFile(wb, 'assets.xlsx');
            showAlert('تم التصدير بنجاح', 'success');
        }

        function printTable() {
            window.print();
        }

        // التهيئة
        window.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('[data-lang]').forEach(btn => {
                btn.addEventListener('click', function() {
                    console.log('Language changed to:', this.getAttribute('data-lang'));
                });
            });
        });
    </script>
</body>
</html>
